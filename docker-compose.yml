name: "orderflow/v2"

services:
    catalog-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: catalog
            POSTGRES_PASSWORD: catalog
            POSTGRES_DB: catalog
        ports:
            - '5432:5432'
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
            interval: 5s
            timeout: 5s
            retries: 5

    orders-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: orders
            POSTGRES_PASSWORD: orders
            POSTGRES_DB: orders
        ports:
            - '5433:5432'
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
            interval: 5s
            timeout: 5s
            retries: 5

    catalog-service:
        build: ./catalog_service
        environment:
            DB_URL: postgresql+asyncpg://catalog:catalog@catalog-db:5432/catalog
        ports:
          - '8001:8000'
        depends_on:
            catalog-db:
                condition : service_healthy

    order_service:
        build: ./order_service
        environment:
            DB_URL: postgresql+asyncpg://orders:orders@orders-db:5432/orders
        ports:
          - '8002:8000'
        depends_on:
            orders-db:
                condition : service_healthy