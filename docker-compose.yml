name: "orderflow/v2"

services:
    catalog-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: catalog
            POSTGRES_PASSWORD: catalog
            POSTGRESS_DB: catalog
        ports:
            - '5432:5432'
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
            interval: 5s
            timeout: 5s
            retries: 5

    catalog-service:
        build: ./catalog_service
        environment:
            DB_URL: postgresql+asyncpg://catalog:catalog@catalog-db:5432/catalog
        ports:
          - '8001:8000'
        depends_on:
            catalog-db:
                condition : service_healthy