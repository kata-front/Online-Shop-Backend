name: "orderflow/v2"

services:
    catalog-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: catalog
            POSTGRES_PASSWORD: catalog
            POSTGRES_DB: catalog
        ports:
            - '5432:5432'
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
            interval: 5s
            timeout: 5s
            retries: 5

    orders-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: orders
            POSTGRES_PASSWORD: orders
            POSTGRES_DB: orders
        ports:
            - '5433:5432'
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
            interval: 5s
            timeout: 5s
            retries: 5

    payments-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: payments
            POSTGRES_PASSWORD: payments
            POSTGRES_DB: payments
        ports:
            - '5434:5432'
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
            interval: 5s
            timeout: 5s
            retries: 5

    notifs-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: notifs
            POSTGRES_PASSWORD: notifs
            POSTGRES_DB: notifs
        ports:
            - '5435:5432'
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U notifs -d notifs"]
            interval: 5s
            timeout: 5s
            retries: 5

    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq
        ports:
            - '5672:5672'
            - '15672:15672'
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    catalog-service:
        build: ./catalog_service
        environment:
            DB_URL: postgresql+asyncpg://catalog:catalog@catalog-db:5432/catalog
        ports:
          - '8001:8000'
        depends_on:
            catalog-db:
                condition : service_healthy

    order-service:
        build: ./order_service
        environment:
            DB_URL: postgresql+asyncpg://orders:orders@orders-db:5432/orders
            REBITMQ_URL: amqp://guest:guest@rabbitmq:5672
        ports:
          - '8002:8000'
        depends_on:
            orders-db:
                condition : service_healthy
            rabbitmq:
                condition : service_healthy

    payment-service:
        build: ./payment_service
        environment:
            DB_URL: postgresql+asyncpg://payments:payments@payments-db:5432/payments
            REBITMQ_URL: amqp://guest:guest@rabbitmq:5672
        ports:
          - '8003:8000'
        depends_on:
            payments-db:
                condition : service_healthy
            rabbitmq:
                condition : service_healthy

    notifs-service:
        build: ./notification-service
        environment:
            DB_URL: postgresql+asyncpg://notifs:notifs@notifs-db:5432/notifs
            REBITMQ_URL: amqp://guest:guest@rabbitmq:5672
        ports:
          - '8004:8000'
        depends_on:
            notifs-db:
                condition : service_healthy
            rabbitmq:
                condition : service_healthy